services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: riotapi_analytics
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////data/RiotAPI_Analytics.db
      - PYTHONPATH=/app
    volumes:
      - riotapi_data:/data
    restart: unless-stopped

volumes:
  riotapi_data:

