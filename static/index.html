<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kindred Analytics Dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="container">
        <header class="header-kindred">
            <img src="/static/kindred-fundo.gif" alt="Kindred Art" class="kindred-avatar" onerror="this.style.display='none'">
            <div>
                <h1>Kindred Analytics</h1>
            </div>
        </header>

        <div class="nav-buttons">
            <button class="tab-btn" onclick="mudarAba('runas', this)">Winrate das Runas</button>
            <button class="tab-btn active" onclick="mudarAba('itens', this)">Winrate de Itens</button>
            <button class="tab-btn" onclick="mudarAba('matchups', this)">Matchups</button>
        </div>

        <div class="card glass-panel">
            <h2 id="panel-title">Winrate dos Itens</h2>

                <div id="items-container" class="items-grid"></div>
                <div id="runes-container" style="display:none"></div>
                <div id="matchups-container" class="matchups-grid" style="display:none"></div>
        </div>
    </div>

    <dialog id="ai-detail-modal" class="ai-modal" aria-labelledby="ai-modal-title">
        <div class="ai-modal-box">
            <header class="ai-modal-header">
                <div>
                    <h2 id="ai-modal-title" class="ai-modal-title">Análise com IA</h2>
                    <p id="ai-modal-subtitle" class="ai-modal-subtitle"></p>
                </div>
                <button type="button" id="ai-modal-close" class="ai-modal-close"
                aria-label="Fechar janela">&times;</button>
            </header>

        <div id="ai-modal-loading" class="ai-modal-state" hidden>
            <span class="ai-spinner" aria-hidden="true"></span>
                <p>Consultando análise da IA...</p>
        </div>
        <div id="ai-modal-error" class="ai-modal-state ai-modal-error"
            role="alert" hidden></div>
        <div id="ai-modal-empty" class="ai-modal-state" hidden>
            <p>Nenhum detalhe disponível para este registro.</p>
        </div>
            <div id="ai-modal-content" class="ai-modal-content" hidden></div>
        </div>
    </dialog>

    <script src="/static/perksAndMatchups.js"></script>
    <script src="/static/script.js"></script>
    <script src="/static/detail-modal.js"></script>
</body>
</html>
